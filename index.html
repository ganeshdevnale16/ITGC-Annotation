<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentic Controls Testing – ITGC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{color-scheme:light;--tx:#1e293b;--mu:#64748b;--lt:#94a3b8;--bd:#e2e8f0;--bg2:#f8fafc;--bg3:#f1f5f9;--ac:#6366f1;--okb:#dcfce7;--okf:#166534;--bdb:#fee2e2;--bdf:#991b1b;--amb:#ffedd5;--amf:#9a3412;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#fff;color:var(--tx);font:14px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
nav{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--bd);background:#fff}
nav .l{display:flex;align-items:center}nav img{height:40px;width:auto}nav .dv{height:20px;width:1px;background:#9ca3af;margin:0 14px 0 6px}nav b{font-size:16px;font-weight:600}
nav .r{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#475569}nav .r i{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.pill{font-size:11px;font-weight:700;color:var(--amf);background:var(--amb);border-radius:99px;padding:2px 10px}
.wrap{flex:1;min-height:0;display:flex}.mn{flex:1;min-width:0;display:flex;flex-direction:column}
#sb{width:260px;flex:none;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.sh{padding:14px 16px 4px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;line-height:1.4}.sh i{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.nc{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--tx)}.nc:hover{background:var(--bg3)}
.rl{flex:1;padding:0 12px;overflow-y:auto}.rt{font-size:10px;color:var(--lt);padding:0 8px 8px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.ri{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:#475569;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri:hover,.ri.on{background:var(--bg3)}.ri.on{color:var(--tx);font-weight:600}
.sf{padding:16px;border-top:1px solid var(--bd);font-size:12px;color:var(--lt)}
.mb{display:none;background:none;border:none;font-size:20px;margin-right:6px}
@media (max-width:760px){.mb{display:block}#sb{position:fixed;top:56px;bottom:0;left:0;z-index:20;transform:translateX(-100%);transition:transform .2s}#sb.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.2)}}
#chat{flex:1;overflow-y:auto;padding:12px 0}.col{max-width:1000px;margin:0 auto}
.a{position:relative;padding:14px 32px 14px 68px}.a .av{position:absolute;left:24px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center}
.u{display:flex;justify-content:flex-end;padding:4px 32px}.u div{background:var(--bd);border-radius:16px;padding:9px 14px;max-width:70%}
.a p{margin:0 0 10px}.a p:last-child{margin-bottom:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer}.pri{background:var(--tx);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}.sec{background:#fff;color:#475569;border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}.sec:hover{background:var(--bg3)}
.tb{border:1px solid var(--bd);border-radius:10px;overflow:auto;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--bg2);color:var(--mu);text-align:left;padding:9px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:9px 12px;color:#475569;border-bottom:1px solid var(--bg3);vertical-align:top}tr:last-child td{border-bottom:none}tbody tr:nth-child(even){background:#fafbfc}
td.m,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ac);font-size:12.5px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}.bd.p{background:var(--okb);color:var(--okf)}.bd.f{background:var(--bdb);color:var(--bdf)}.bd.n{background:var(--amb);color:var(--amf)}
.cl{border:1px solid var(--bd);background:var(--bg2);border-radius:10px;padding:14px 16px;margin:6px 0}
.clh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}.clh span{color:var(--ac)}
.pb{height:5px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:10px}.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s,background .4s}
.st{display:flex;gap:10px;padding:8px 0;border-top:1px solid #eef2f6;opacity:.45;transition:opacity .3s}.st.run,.st.done{opacity:1}
.ci{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.st.run .ci{border-color:var(--ac);border-top-color:transparent;animation:sp .8s linear infinite}.st.done .ci{background:var(--okb);border-color:var(--okb);color:var(--okf)}
@keyframes sp{to{transform:rotate(360deg)}}
.stt{font-size:13.5px;font-weight:600}.std{font-size:12.5px;color:var(--mu);line-height:1.5}.sub{margin-top:4px}.sub div{font-size:12.5px;color:#475569;display:flex;gap:8px;align-items:center;padding:1px 0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}.kp div{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;background:#fff}.kp b{display:block;font-size:24px;line-height:1.2}.kp span{font-size:12px;color:var(--mu)}
.ok{color:var(--okf)}.bad{color:var(--bdf)}.mut{color:var(--mu);font-size:12.5px}
canvas{max-width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;display:block;margin-top:8px}
.ex{border:1px solid var(--bd);border-left:4px solid #dc2626;border-radius:8px;padding:10px 14px;margin:8px 0;background:#fff}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lt);margin:0 2px;animation:bl 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes bl{50%{opacity:.25}}
footer{flex:none;border-top:1px solid var(--bd);padding:12px 20px 8px;background:#fff}
.box{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:8px 8px 8px 12px}
.box input[type=text]{flex:1;border:none;background:transparent;outline:none;font:inherit;color:var(--tx);padding:6px 4px}
.clip{background:none;border:none;color:var(--lt);font-size:20px;padding:4px}.send{width:36px;height:36px;border:none;border-radius:10px;background:var(--tx);color:#fff;font-size:15px}
.fn{text-align:center;font-size:11px;color:var(--lt);margin-top:6px}
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:30;overflow:auto;padding:20px 12px}#modal.on{display:block}
#sheet{background:#fff;max-width:920px;margin:0 auto;border-radius:12px;padding:0;overflow:hidden}.bar{display:flex;gap:8px;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0}
/* report */
.rp{padding:36px 44px;color:var(--tx);font-size:13.5px}.rp h1{font-size:24px;margin:18px 0 2px;line-height:1.25}.rp .sb{color:var(--mu);margin-bottom:18px}
.rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ac);padding-bottom:12px}.rh img{height:46px}.rh span{font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--mu);text-transform:uppercase;text-align:right}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--bd);border-radius:10px;margin:14px 0}.mg div{padding:10px 14px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}.mg div:nth-child(3n){border-right:none}.mg div:nth-last-child(-n+3){border-bottom:none}.mg small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--lt);font-weight:700}
.rp h2{font-size:15px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--ac);line-height:1.3}
.cb{border-radius:10px;padding:14px 18px;margin:10px 0}.cb.f{background:#fef2f2;border:1px solid #fecaca}.cb.p{background:#f0fdf4;border:1px solid #bbf7d0}.cb b.h{display:block;font-size:16px;margin-bottom:4px}
.rp img{max-width:100%;border:1px solid var(--bd);border-radius:8px}.ev{break-inside:avoid;margin-bottom:16px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}.sg div{border-top:1px solid #94a3b8;padding-top:6px;font-size:12px;color:var(--mu)}
.ft{margin-top:26px;padding-top:10px;border-top:1px solid var(--bd);font-size:11px;color:var(--lt);display:flex;justify-content:space-between;gap:10px}
@media (max-width:640px){.a{padding:12px 16px 12px 56px}.a .av{left:12px}.rp{padding:20px}.mg{grid-template-columns:1fr 1fr}.mg div:nth-child(3n){border-right:1px solid var(--bd)}.mg div:nth-child(2n){border-right:none}}
@media print{nav,#chat,footer,.bar{display:none!important}body{display:block}#modal{position:static;background:none;padding:0;display:block!important;overflow:visible}#sheet{border-radius:0}.rp{padding:0}h2,.cb,table{break-inside:avoid}}
</style>
</head>

<nav><div class="l"><button class="mb" onclick="$('sb').classList.toggle('open')">☰</button><img id="logo" alt="Deloitte"><div class="dv"></div><b>Agentic Controls Testing</b></div><div class="r"><span class="pill">Demo environment</span><i></i>ITGC Control Testing</div></nav>
<div class="wrap"><aside id="sb"><div class="sh"><i></i><span>ITGC Control Testing</span></div><div style="padding:16px"><button class="nc" onclick="newChat()">＋ New Chat</button></div><div class="rl"><div class="rt">Recent</div><div id="rc"></div></div><div class="sf">Powered by AI</div></aside><section class="mn"><div id="chat"><div class="col" id="col"></div></div>
<footer><div class="box"><button class="clip" title="Attach policy (.docx/.txt), Excel extract or screenshots" onclick="$('file').click()">📎</button><input type="file" id="file" hidden multiple accept=".docx,.txt,.md,.xlsx,.xls,.csv,image/*"><input type="text" id="inp" placeholder="Attach the policy document or ask a question…" autocomplete="off"><button class="send" onclick="sub()">➤</button></div>
<div class="fn">Demo with simulated SAP data · AI-assisted results should be reviewed by a qualified tester</div></footer></section></div>
<div id="modal"><div id="sheet"><div class="bar"><button class="pri" onclick="window.print()">Print / Save as PDF</button><button class="sec" onclick="$('modal').classList.remove('on')">Close</button></div><div id="report"></div></div></div>

/* ---------- chat plumbing ---------- */
function scr(){const c=$('chat');c.scrollTop=c.scrollHeight}

function btns(b,list){const d=document.createElement('div');d.className='btns';list.forEach(([l,v,p])=>{const x=document.createElement('button');x.className=p?'pri':'sec';x.textContent=l;x.onclick=()=>{d.remove();send(v)};d.appendChild(x)});b.appendChild(d);scr()}
function sub(){const v=$('inp').value.trim();if(v){$('inp').value='';send(v)}}

async function welcome(){const b=await say(`<p><b>Agentic Controls Testing · IT General Controls</b></p><p>I test IT general controls the way an auditor would. Give me the <b>policy document</b> and I will work out what needs to be tested, <b>go to the system myself</b> to collect the evidence, check completeness, test every requirement, annotate the evidence and prepare the report.</p><p>Please import the policy document to begin.</p>`,500);

 if(!S.attrs.length)return say('I read the document but could not find a testable requirement with a threshold. Please check the wording or import another policy.');
 S.stage='run';setTitle(name);
 await say(`<p>I have read <b>${esc(name)}</b> and identified <b>${S.attrs.length} test attributes</b> to validate against the system:</p><div class="tb"><table><thead><tr><th>#</th><th>SAP parameter</th><th>Requirement</th><th>Rule</th></tr></thead><tbody>${S.attrs.map((a,i)=>`<tr><td>${i+1}</td><td class="m">${esc(a.key)}</td><td>${esc(a.d)}</td><td><b>${OPS[a.op]} ${a.val}</b></td></tr>`).join('')}</tbody></table></div>`,900);
 await sleep(700);run()}

/* ---------- system (simulated connector) ---------- */
function genSAP(){const host='sapds4_DS4_00',aoa=[['Host','Parameter','Value','Status']];
 const set={'login/min_password_lng':12,'login/min_password_digits':2,'login/min_password_specials':0,'login/min_password_uppercase':1,'login/min_password_lowercase':1,'login/password_history_size':3,'login/fails_to_user_lock':5,'login/password_expiration_time':180,'login/min_password_diff':3,'login/min_password_letters':2};
 const fill=['abap/buffersize','rdisp/wp_no_dia','icm/server_port_','ms/server_port_','rfc/max_comm_entries','ssl/ciphersuites','auth/rfc_authority_check','em/initial_size_MB','zcsa/table_buffer_area','rsdb/obj/buffersize'],keys=Object.keys(set);
 for(let i=0;i<1928-keys.length;i++)aoa.push([host,fill[i%10]+'_'+i,String((i*7)%4096),'A']);
 aoa.splice(40,0,[host,'login/min_password_lng',8,'I']);keys.forEach((k,i)=>aoa.splice(120+i*150,0,[host,k,set[k],'A']));return aoa}
function setRows(aoa,name,sheet){let h=0;for(let i=0;i<Math.min(10,aoa.length);i++)if(aoa[i].some(c=>/param|name|key/i.test(c))&&aoa[i].some(c=>/val/i.test(c))){h=i;break}
 const hd=aoa[h].map(String),f=re=>hd.findIndex(c=>re.test(c));let pc=f(/param|name|key/i),vc=f(/value|setting/i),sc=f(/status|state|active/i),hc=f(/host|server|instance/i);if(pc<0)pc=0;if(vc<0)vc=Math.min(1,hd.length-1);
 S.rows=aoa.slice(h+1).map((r,i)=>({n:h+i+2,host:hc>=0?String(r[hc]):'',p:String(r[pc]).trim(),v:r[vc],s:sc>=0?String(r[sc]).trim():''})).filter(r=>r.p);
 const a=S.rows.filter(r=>/^(a|active|1|yes|true)$/i.test(r.s));S.active=a.length?a:S.rows;S.file=name;S.sheet=sheet}

/* ---------- agent run ---------- */
async function run(){
 const own=S.rows.length>0,steps=[['Policy read · test attributes mapped',`${S.attrs.length} attributes identified`]];
 if(own)steps.push(['Evidence loaded from your extract',S.file]);else steps.push(['Connecting to SAP DS4 (client 100)','Read-only service account · session opened'],['Extracting parameter population','']);
 steps.push(['Completeness & accuracy check',''],['Random sample tie-out',''],['Testing attributes against policy',''],['Annotating evidence & generating report','']);
 const b=await say(`<p>Now I will collect the evidence from the system on my own. No files are needed from you.</p><div class="cl"><div class="clh"><span style="color:var(--tx)" id="clt">Running control tests and validating evidence…</span><span id="clp">0%</span></div><div class="pb"><i id="pbi"></i></div><div id="cls">${steps.map((s,i)=>`<div class="st" id="s${i}"><div class="ci"></div><div><div class="stt">${s[0]}</div><div class="std" id="d${i}">${s[1]}</div><div class="sub" id="b${i}"></div></div></div>`).join('')}</div></div>`,500);
 let k=0;const go=async(i,ms)=>{$('s'+i).className='st run';scr();await sleep(ms)},fin=i=>{$('s'+i).className='st done';$('s'+i).querySelector('.ci').textContent='✓';const p=Math.round((i+1)/steps.length*100);$('clp').textContent=p+'%';$('pbi').style.width=p+'%'},det=(i,t)=>$('d'+i).innerHTML=t;
 const M=S.meta={ts:new Date(),tbl:'PAHI',sys:'SAP DS4 (client 100)',exp:null};
 await go(0,500);fin(0);k=1;
 if(own){await go(1,500);fin(1);M.sys=S.rows.find(r=>r.host)?.host||'Provided extract';k=2}
 else{await go(1,900);fin(1);await go(2,500);det(2,'Opening SE16 → table <b>PAHI</b> · filter STATUS = A');await sleep(900);setRows(genSAP(),'SAP_PAHI_extract_DS4.xlsx','PAHI');M.exp=S.active.length;det(2,`<b>${M.exp}</b> active entries on SAP screen · screenshot captured · exported to Excel`);fin(2);k=3}
 M.total=S.rows.length;M.active=S.active.length;M.ca=M.exp==null?null:M.exp==M.active;
 await go(k,800);det(k,M.exp==null?`${M.active} active entries (no SAP screen count supplied)`:`Excel <b>${M.active}</b> = SAP screen <b>${M.exp}</b> · <b class="ok">match</b>`);fin(k);k++;
 const pool=[...S.active],samp=[];while(samp.length<5&&pool.length)samp.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);M.samp=samp;
 await go(k,800);det(k,`${samp.length} randomly selected entries agree with the source`);fin(k);k++;
 await go(k,300);S.res=[];for(const a of S.attrs){const idx=S.active.findIndex(r=>r.p.toLowerCase()==a.key.toLowerCase()),r=idx>=0?S.active[idx]:null,act=r?(isNaN(parseFloat(r.v))?String(r.v):parseFloat(r.v)):null;let res='n';
  if(r){const x=typeof act=='number'?act:NaN;res=(a.op=='min'?x>=a.val:a.op=='max'?x<=a.val:String(act)==String(a.val))?'p':'f'}
  S.res.push({a,r,idx,act,res});const el=document.createElement('div');el.innerHTML=`<span class="bd ${res}">${res=='p'?'PASS':res=='f'?'FAIL':'NOT FOUND'}</span><span><span class="mono">${esc(a.key)}</span> · actual <b>${r?esc(act):'–'}</b> vs ${OPS[a.op]} ${a.val}</span>`;$('b'+k).appendChild(el);scr();await sleep(380)}
 fin(k);k++;await go(k,300);S.res.forEach(x=>{if(x.r)x.img=draw(x).toDataURL('image/png')});await sleep(900);buildReport();fin(k);
 $('clt').textContent='Control testing complete';$('pbi').style.background='#16a34a';$('clp').style.color='#16a34a';S.stage='done';summary()}

async function summary(){
 const p=S.res.filter(x=>x.res=='p').length,f=S.res.filter(x=>x.res=='f').length,n=S.res.filter(x=>x.res=='n').length,M=S.meta;
 const b=await say(`<p>Control testing complete. Here are the validated results:</p>
 <div class="kp"><div><b>${S.res.length}</b><span>Attributes tested</span></div><div><b class="ok">${p}</b><span>Passed</span></div><div><b class="${f?'bad':''}">${f}</b><span>Exceptions</span></div><div><b>${M.active.toLocaleString()}</b><span>Population tested</span></div></div>
 <div class="tb"><table><thead><tr><th>#</th><th>SAP parameter</th><th>Policy</th><th>Actual</th><th>Conclusion</th><th>Evidence</th></tr></thead><tbody>${S.res.map((x,i)=>`<tr><td>${i+1}</td><td class="m">${esc(x.a.key)}</td><td>${OPS[x.a.op]} ${x.a.val}</td><td>${x.r?esc(x.act):'–'}</td><td><span class="bd ${x.res}">${x.res=='p'?'PASS':x.res=='f'?'FAIL':'NOT FOUND'}</span></td><td>${x.r?`<button class="sec" style="padding:2px 10px;font-size:12px" onclick="showEv(${i})">View</button>`:''}</td></tr>`).join('')}</tbody></table></div>
 <p>${f||n?`<b>${f+n} exception${f+n>1?'s':''} noted.</b> I have prepared the full report with annotated evidence and recommended actions.`:'<b>No exceptions noted.</b> The full report with annotated evidence is ready.'}</p>`,700);
 btns(b,[['View full report','report',1],...(f?[['Explain the exceptions','why']]:[])])}
async function showEv(i){const x=S.res[i],b=await say(`<p><b class="mono">${esc(x.a.key)}</b>: actual <b>${esc(x.act)}</b> against policy ${OPS[x.a.op]} ${x.a.val}</p>`,200);b.appendChild(draw(x));scr()}
async function qa(t,l){
 if(/report|print|pdf|download/.test(l)){$('modal').classList.add('on');$('sheet').scrollTop=0;return}
 if(/restart|new test|start over|new chat/.test(l)){return newChat()}
 const f=S.res.filter(x=>l.includes(x.a.key)||(KB.find(k=>k.key==x.a.key)||{syn:[]}).syn.some(s=>l.includes(s)));
 if(f.length&&!/why|exception/.test(l)){const x=f[0];await say(x.r?`<p><b>${esc(x.a.d)}</b> is configured as <b>${esc(x.act)}</b>. Policy requires ${x.a.op=='min'?'at least':x.a.op=='max'?'at most':'exactly'} <b>${x.a.val}</b>: <span class="bd ${x.res}">${x.res=='p'?'PASS':'FAIL'}</span></p>`:'That parameter was not found in the active population.',400);if(x.r)showEv(S.res.indexOf(x));return}
 if(/why|fail|exception|issue|gap|result|summary/.test(l)){const fl=S.res.filter(x=>x.res!='p');return say(fl.length?`<p>${fl.length} exception${fl.length>1?'s':''} found:</p>`+fl.map(x=>`<div class="ex"><b>${esc(x.a.d)}</b> <span class="mono">${esc(x.a.key)}</span><br>Configured: <b>${x.r?esc(x.act):'not found'}</b> · Policy: ${OPS[x.a.op]} ${x.a.val} · Severity: <b>${x.a.sev}</b><br><span class="mut">Recommended action: ${rec(x)}</span></div>`).join(''):'Every attribute complied with policy.',500)}
 return say('I can explain any exception, show the evidence for a parameter, or open the report. What would you like?',300)}
const rec=x=>x.r?`set ${x.a.key} to ${OPS[x.a.op]} ${x.a.val} in the instance profile (RZ10), restart the instance and re-test.`:`confirm the parameter is maintained for this instance and re-run the extract.`;

/* ---------- evidence annotation ---------- */
function draw(x){const W_=820,H=330,c=document.createElement('canvas');c.width=W_;c.height=H;const g=c.getContext('2d'),M=S.meta;
 g.fillStyle='#fff';g.fillRect(0,0,W_,H);g.fillStyle='#e2e8f0';g.fillRect(0,0,W_,34);g.fillStyle='#1e293b';g.font='bold 14px Arial';g.fillText(`Display Table Entries – ${M.tbl}   (extract: ${S.file})`,12,22);
 g.fillStyle='#f1f5f9';g.fillRect(0,34,W_,26);g.fillStyle='#475569';g.font='bold 13px Arial';[['Host',16],['Parameter',230],['Value',530],['Status',650]].forEach(cc=>g.fillText(cc[0],cc[1],52));
 const rows=S.active.slice(Math.max(0,x.idx-2),Math.max(0,x.idx-2)+5);let vx=null;
 rows.forEach((r,k)=>{const y=60+k*30,hit=r===x.r;g.fillStyle=hit?'#fef9c3':(k%2?'#fafbfc':'#fff');g.fillRect(0,y,W_,30);g.fillStyle='#1e293b';g.font='13px Arial';g.fillText(r.host||'–',16,y+20);g.fillText(r.p,230,y+20);g.fillText(String(r.v),530,y+20);g.fillText(r.s||'A',650,y+20);g.fillStyle='#94a3b8';g.fillText('row '+r.n,730,y+20);if(hit)vx={y,w:g.measureText(String(r.v)).width}});
 if(vx){const ok=x.res=='p';g.lineWidth=3;g.strokeStyle=ok?'#16a34a':'#dc2626';g.strokeRect(524,vx.y+3,Math.max(vx.w+12,40),24);g.strokeStyle='#6366f1';g.lineWidth=2;g.font='13px Arial';g.strokeRect(224,vx.y+3,g.measureText(x.r.p).width+12,24);g.font='bold 11px Arial';g.fillStyle='#6366f1';g.fillText('parameter',224,vx.y);g.fillStyle=ok?'#16a34a':'#dc2626';g.fillText('value tested',524,vx.y)}
 const y0=222;g.fillStyle='#f8fafc';g.fillRect(8,y0,W_-16,H-y0-8);g.strokeStyle='#6366f1';g.lineWidth=2;g.strokeRect(8,y0,W_-16,H-y0-8);g.fillStyle='#1e293b';g.font='bold 13px Arial';g.fillText('EVIDENCE ANNOTATION',20,y0+20);
 [`Source: ${S.file} › ${S.sheet}, row ${x.r.n}   |   Table: ${M.tbl}   |   Host: ${x.r.host||M.sys}`,`Population: ${M.active} active of ${M.total} entries${M.exp!=null?` (SAP screen: ${M.exp} – ${M.ca?'match':'MISMATCH'})`:''}`,`Policy: ${x.a.key} ${OPS[x.a.op]} ${x.a.val}   |   Actual: ${x.act}   |   Result: ${x.res=='p'?'PASS':'FAIL'}`,`Tested by Agentic Controls Testing on ${M.ts.toLocaleString()}`].forEach((t,i)=>{g.fillStyle=i==2?(x.res=='p'?'#16a34a':'#dc2626'):'#475569';g.font=(i==2?'bold ':'')+'12px Arial';g.fillText(t,20,y0+42+i*20)});return c}

/* ---------- executive report ---------- */
function buildReport(){
 const M=S.meta,N=S.res.length,p=S.res.filter(x=>x.res=='p').length,fl=S.res.filter(x=>x.res!='p'),f=fl.length,d=M.ts.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}),id='ITGC-'+M.ts.toISOString().slice(0,10).replace(/-/g,'')+'-001';
 const hi=fl.filter(x=>x.a.sev=='High').length,tag=x=>`<span class="bd ${x.res}">${x.res=='p'?'PASS':x.res=='f'?'FAIL':'NOT FOUND'}</span>`;
 $('report').innerHTML=`<div class="rp">
 <div class="rh"><img src="${LOGO}" alt="Deloitte"><span>IT General Controls<br>Test Report</span></div>
 <h1>Password Configuration Control – Test Results</h1><div class="sb">${esc(M.sys)} · ${d}</div>
 <div class="mg"><div><small>System</small>${esc(M.sys)}</div><div><small>Evidence source</small>${esc(S.file)}</div><div><small>Report reference</small>${id}</div><div><small>Population</small>${M.active.toLocaleString()} active of ${M.total.toLocaleString()} entries</div><div><small>Performed by</small>Agentic Controls Testing</div><div><small>Reviewer sign-off</small>Pending</div></div>
 <h2>Executive summary</h2>
 <div class="cb ${f?'f':'p'}"><b class="h ${f?'bad':'ok'}">${f?`Exceptions noted in ${f} of ${N} test attributes${hi?` (${hi} high severity)`:''}`:`No exceptions: all ${N} test attributes comply with policy`}</b>${f?`System password settings do not fully meet the approved password policy. Weak or non-compliant settings increase the risk of unauthorised access to financial applications and data, which is relevant to ICoFR. The exceptions and recommended actions are set out in section 4.`:`System password settings are configured in line with the approved password policy.`}</div>
 <div class="kp"><div><b>${N}</b><span>Attributes tested</span></div><div><b class="ok">${p}</b><span>Passed</span></div><div><b class="${f?'bad':''}">${f}</b><span>Exceptions</span></div><div><b>${M.exp==null?'n/a':M.ca?'Agreed':'Differs'}</b><span>Population vs SAP screen</span></div></div>
 <h2>1. Scope and approach</h2><p>The agent read the approved password policy, identified ${N} measurable requirements and mapped each to its SAP profile parameter. It then retrieved the active parameter population from table ${esc(M.tbl)}, verified completeness and accuracy, and tested each requirement against the policy threshold. Each result is supported by annotated evidence in section 5.</p>
 <h2>2. Completeness and accuracy of the population</h2>
 <div class="tb"><table><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>
 <tr><td>Record count agrees to SAP screen</td><td><span class="bd ${M.exp==null?'n':M.ca?'p':'f'}">${M.exp==null?'N/A':M.ca?'AGREED':'DIFFERS'}</span></td><td>${M.exp==null?'No SAP screen count was supplied':`Excel ${M.active.toLocaleString()} vs SAP ${M.exp.toLocaleString()}`}</td></tr>
 <tr><td>Only active parameters included</td><td><span class="bd p">OK</span></td><td>${M.total-M.active} inactive or superseded entries excluded</td></tr>
 <tr><td>Random sample tied to source (${M.samp.length} items)</td><td><span class="bd p">AGREED</span></td><td>${M.samp.map(r=>'row '+r.n).join(', ')}</td></tr></tbody></table></div>
 <h2>3. Test results</h2>
 <div class="tb"><table><thead><tr><th>#</th><th>Requirement</th><th>SAP parameter</th><th>Policy</th><th>Actual</th><th>Conclusion</th></tr></thead><tbody>${S.res.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.a.d)}</td><td class="m">${esc(x.a.key)}</td><td>${OPS[x.a.op]} ${x.a.val}</td><td><b>${x.r?esc(x.act):'not found'}</b></td><td>${tag(x)}</td></tr>`).join('')}</tbody></table></div>
 ${f?`<h2>4. Exceptions and recommended actions</h2><div class="tb"><table><thead><tr><th>Parameter</th><th>Gap</th><th>Severity</th><th>Recommended action</th><th>Owner</th></tr></thead><tbody>${fl.map(x=>`<tr><td><b>${esc(x.a.d)}</b><br><span class="mono">${esc(x.a.key)}</span></td><td>${x.r?`Configured ${esc(x.act)}, policy ${OPS[x.a.op]} ${x.a.val}`:'Not found'}</td><td><span class="bd ${x.a.sev=='High'?'f':'n'}">${x.a.sev.toUpperCase()}</span></td><td>${rec(x)}</td><td>SAP Basis / Security</td></tr>`).join('')}</tbody></table></div>`:`<h2>4. Exceptions</h2><p>None noted.</p>`}
 <h2>5. Annotated evidence</h2>${S.res.filter(x=>x.img).map((x,i)=>`<div class="ev"><b>5.${i+1} ${esc(x.a.d)}</b> ${tag(x)}<br><img src="${x.img}" alt="Evidence for ${esc(x.a.key)}"></div>`).join('')}
 ${S.shots.length?`<h2>6. Reference screenshots</h2>${S.shots.map(s=>`<div class="ev"><div class="mut">${esc(s.name)}</div><img src="${s.url}"></div>`).join('')}`:''}
 <div class="sg"><div>Prepared by: Agentic Controls Testing<br>${d}</div><div>Reviewed by: ______________________<br>Date: ______________</div></div>
 <div class="ft"><span>Demonstration report generated with simulated data · ${id}</span><span>Draft for management review</span></div></div>`}
</script>
